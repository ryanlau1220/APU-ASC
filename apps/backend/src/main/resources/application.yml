server:
  port: 8081
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: apu-asc-backend
  mvc:
    problemdetails:
      enabled: true
  profiles:
    active: dev

  devtools:
    restart:
      enabled: true
      poll-interval: 1000ms
      quiet-period: 500ms
    livereload:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/apu_asc?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 3000
      # Diagnostic only: long enough to avoid normal request noise, short enough to expose leaks.
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_THRESHOLD:10000}

  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000ms
      cache-null-values: false

  jpa:
    # API services must fully load/map their DTOs within their service-layer transaction. In
    # particular, this prevents long-lived SSE responses from retaining a JDBC connection.
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  modulith:
    # Replays events left incomplete by a restart. Event consumers are implemented idempotently.
    republish-outstanding-events-on-restart: true

  task:
    execution:
      pool:
        core-size: ${ASYNC_CORE_POOL_SIZE:4}
        max-size: ${ASYNC_MAX_POOL_SIZE:8}
        queue-capacity: ${ASYNC_QUEUE_CAPACITY:200}
        keep-alive: 60s
      shutdown:
        await-termination: true
        await-termination-period: 30s

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: apu-asc-web
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: "${OAUTH2_REDIRECT_URI:http://localhost:3000/login/oauth2/code/{registrationId}}"
        provider:
          keycloak:
            issuer-uri: ${JWT_ISSUER_URI:http://localhost/auth/realms/apu-asc}
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/token}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/userinfo}
            jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/certs}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost/auth/realms/apu-asc}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/certs}
          token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/token}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:liujunhong20@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
      timeout: 5s
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      roles: MANAGER,SYSTEM_ADMIN
      probes:
        enabled: true
        add-additional-paths: true

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${OBSERVABILITY_ENVIRONMENT:development}
  release: ${OBSERVABILITY_RELEASE:dev}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false
  exception-resolver-order: -2147483647

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  pattern:
    console: "[%d{HH:mm:ss} UTC] [%X{traceId:-sys}] %clr(%-5level): %msg%n"
  level:
    root: INFO
    com.apu.asc: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.apache.catalina.core.ContainerBase: OFF
    org.apache.catalina.core.StandardHostValue: OFF
    org.apache.catalina.valves.ErrorReportValve: OFF

# Cloudflare R2 / S3 Configuration
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:us-east-1}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadminpassword}
  bucket: ${S3_BUCKET:apu-asc-assets}

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost/auth}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    realm: ${KEYCLOAK_ADMIN_REALM:apu-asc}

scheduling:
  default-slot-capacity: ${SCHEDULING_DEFAULT_SLOT_CAPACITY:3}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}

invitations:
  expiry-hours: ${INVITATION_EXPIRY_HOURS:48}

event-publications:
  retry:
    initial-delay-ms: ${EVENT_PUBLICATION_RETRY_INITIAL_DELAY_MS:60000}
    fixed-delay-ms: ${EVENT_PUBLICATION_RETRY_DELAY_MS:60000}
    minimum-age: ${EVENT_PUBLICATION_RETRY_MINIMUM_AGE:PT30S}
  cleanup:
    cron: "${EVENT_PUBLICATION_CLEANUP_CRON:0 15 3 * * *}"
    retention: ${EVENT_PUBLICATION_RETENTION:P30D}

observability:
  prometheus:
    allowed-cidr: ${OBSERVABILITY_PROMETHEUS_ALLOWED_CIDR:127.0.0.1/32}
