server:
  port: 8081
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: apu-asc-backend
  mvc:
    problemdetails:
      enabled: true
  profiles:
    active: dev

  devtools:
    restart:
      enabled: true
      poll-interval: 1000ms
      quiet-period: 500ms
    livereload:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/apu_asc?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 3000
      leak-detection-threshold: 2000

  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000ms
      cache-null-values: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: apu-asc-web
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: "${OAUTH2_REDIRECT_URI:http://localhost:3000/login/oauth2/code/{registrationId}}"
        provider:
          keycloak:
            issuer-uri: ${JWT_ISSUER_URI:http://localhost/auth/realms/apu-asc}
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/token}
            user-info-uri: ${KEYCLOAK_USERINFO_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/userinfo}
            jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/certs}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost/auth/realms/apu-asc}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/certs}
          token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/token}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:liujunhong20@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  tracing:
    sampling:
      probability: 1.0
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: always

sentry:
  dsn: ${SENTRY_DSN:https://examplePublicKey@o0.ingest.sentry.io/0}
  traces-sample-rate: 1.0
  send-default-pii: false
  exception-resolver-order: -2147483647

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  pattern:
    console: "[%d{HH:mm:ss} UTC] [%X{traceId:-sys}] %clr(%-5level): %msg%n"
  level:
    root: INFO
    com.apu.asc: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.apache.catalina.core.ContainerBase: OFF
    org.apache.catalina.core.StandardHostValue: OFF
    org.apache.catalina.valves.ErrorReportValve: OFF

# Cloudflare R2 / S3 Configuration
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:us-east-1}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadminpassword}
  bucket: ${S3_BUCKET:apu-asc-assets}

keycloak:
  admin:
    server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost/auth}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    realm: ${KEYCLOAK_ADMIN_REALM:apu-asc}

scheduling:
  default-slot-capacity: ${SCHEDULING_DEFAULT_SLOT_CAPACITY:3}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}

invitations:
  expiry-hours: ${INVITATION_EXPIRY_HOURS:48}
