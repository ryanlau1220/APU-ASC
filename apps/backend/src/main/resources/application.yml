server:
  port: 8081
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: apu-asc-backend
  mvc:
    problemdetails:
      enabled: true
  profiles:
    active: dev

  devtools:
    restart:
      enabled: true
      poll-interval: 1000ms
      quiet-period: 500ms
    livereload:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/apu_asc?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 60000
      connection-timeout: 10000
      validation-timeout: 3000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: apu-asc-web
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            redirect-uri: "${OAUTH2_REDIRECT_URI:http://localhost:3000/login/oauth2/code/{registrationId}}"
        provider:
          keycloak:
            issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost/auth/realms/apu-asc}
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost/auth/realms/apu-asc}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/certs}
          token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost/auth/realms/apu-asc/protocol/openid-connect/token}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:liujunhong20@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:tvjg byun uipz umf}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  pattern:
    console: "[%d{HH:mm:ss} UTC] %clr(%-5level): %msg%n"
  level:
    root: INFO
    com.apu.asc: INFO
    org.springframework.security: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.apache.catalina.core.ContainerBase: OFF
    org.apache.catalina.core.StandardHostValue: OFF
    org.apache.catalina.valves.ErrorReportValve: OFF

# Cloudflare R2 / S3 Configuration
s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  region: ${S3_REGION:us-east-1}
  access-key: ${S3_ACCESS_KEY:minioadmin}
  secret-key: ${S3_SECRET_KEY:minioadminpassword}
  bucket: ${S3_BUCKET:apu-asc-assets}
