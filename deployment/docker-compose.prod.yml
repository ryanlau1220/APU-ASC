name: apu-asc-prod

services:
  postgres:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY in deployment/.env.prod}/apu-asc-postgres:${IMAGE_TAG:?Set IMAGE_TAG in deployment/.env.prod}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deployment/.env.prod}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deployment/.env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env.prod}
      POSTGRES_INITDB_ARGS: --data-checksums
      KEYCLOAK_DB: ${KEYCLOAK_DB:?Set KEYCLOAK_DB in deployment/.env.prod}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in deployment/.env.prod}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in deployment/.env.prod}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:?Set BACKUP_S3_ACCESS_KEY in deployment/.env.prod}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:?Set BACKUP_S3_SECRET_KEY in deployment/.env.prod}
      AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT:?Set BACKUP_S3_ENDPOINT in deployment/.env.prod}
      AWS_REGION: ${BACKUP_S3_REGION:-auto}
      WALG_S3_PREFIX: s3://${POSTGRES_BACKUP_S3_BUCKET:?Set POSTGRES_BACKUP_S3_BUCKET in deployment/.env.prod}/wal-g
      WALG_PGP_KEY_PATH: /run/secrets/walg_pgp_public_key
      WALG_COMPRESSION_METHOD: zstd
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3
      - -c
      - archive_mode=on
      - -c
      - archive_command=wal-g wal-push %p
      - -c
      - archive_timeout=300
      - -c
      - wal_compression=on
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/10-keycloak-db.sh:ro
      - ${WALG_PGP_PUBLIC_KEY_PATH:?Set WALG_PGP_PUBLIC_KEY_PATH in deployment/.env.prod}:/run/secrets/walg_pgp_public_key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  postgres-backup:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY in deployment/.env.prod}/apu-asc-postgres:${IMAGE_TAG:?Set IMAGE_TAG in deployment/.env.prod}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deployment/.env.prod}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deployment/.env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env.prod}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in deployment/.env.prod}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env.prod}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:?Set BACKUP_S3_ACCESS_KEY in deployment/.env.prod}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:?Set BACKUP_S3_SECRET_KEY in deployment/.env.prod}
      AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT:?Set BACKUP_S3_ENDPOINT in deployment/.env.prod}
      AWS_REGION: ${BACKUP_S3_REGION:-auto}
      WALG_S3_PREFIX: s3://${POSTGRES_BACKUP_S3_BUCKET:?Set POSTGRES_BACKUP_S3_BUCKET in deployment/.env.prod}/wal-g
      WALG_PGP_KEY_PATH: /run/secrets/walg_pgp_public_key
      WALG_COMPRESSION_METHOD: zstd
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until pg_isready -h "$${PGHOST}" -U "$${PGUSER}" -d "$${POSTGRES_DB}"; do sleep 2; done
        wal-g backup-push /var/lib/postgresql/data
        while sleep 86400; do wal-g backup-push /var/lib/postgresql/data; done
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - ${WALG_PGP_PUBLIC_KEY_PATH:?Set WALG_PGP_PUBLIC_KEY_PATH in deployment/.env.prod}:/run/secrets/walg_pgp_public_key:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  valkey:
    image: valkey/valkey:7.2-alpine
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in deployment/.env.prod}
    command: ["sh", "-ec", "exec valkey-server --appendonly yes --requirepass \"$${VALKEY_PASSWORD}\""]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$${VALKEY_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in deployment/.env.prod}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in deployment/.env.prod}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB:?Set KEYCLOAK_DB in deployment/.env.prod}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in deployment/.env.prod}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in deployment/.env.prod}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${APP_DOMAIN:?Set APP_DOMAIN in deployment/.env.prod}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m"
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:?Set APP_FRONTEND_BASE_URL in deployment/.env.prod}
      INITIAL_MANAGER_USERNAME: ${INITIAL_MANAGER_USERNAME:?Set INITIAL_MANAGER_USERNAME in deployment/.env.prod}
      INITIAL_MANAGER_EMAIL: ${INITIAL_MANAGER_EMAIL:?Set INITIAL_MANAGER_EMAIL in deployment/.env.prod}
      INITIAL_MANAGER_PASSWORD: ${INITIAL_MANAGER_PASSWORD:?Set INITIAL_MANAGER_PASSWORD in deployment/.env.prod}
      SMTP_HOST: ${SPRING_MAIL_HOST:?Set SPRING_MAIL_HOST in deployment/.env.prod}
      SMTP_PORT: ${SPRING_MAIL_PORT:?Set SPRING_MAIL_PORT in deployment/.env.prod}
      SMTP_FROM: ${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in deployment/.env.prod}
      SMTP_USERNAME: ${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in deployment/.env.prod}
      SMTP_PASSWORD: ${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD in deployment/.env.prod}
    volumes:
      - ./keycloak/apu-asc-realm.json:/opt/keycloak/data/import/apu-asc-realm.json:ro
      - ../infra/keycloak/themes/apu-asc:/opt/keycloak/themes/apu-asc:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /auth/realms/apu-asc/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -c 20 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

  backend:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY in deployment/.env.prod}/apu-asc-backend:${IMAGE_TAG:?Set IMAGE_TAG in deployment/.env.prod}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Set SPRING_DATASOURCE_URL in deployment/.env.prod}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in deployment/.env.prod}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env.prod}
      VALKEY_HOST: ${VALKEY_HOST:-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in deployment/.env.prod}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:?Set APP_FRONTEND_BASE_URL in deployment/.env.prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in deployment/.env.prod}
      OAUTH2_REDIRECT_URI: ${OAUTH2_REDIRECT_URI:?Set OAUTH2_REDIRECT_URI in deployment/.env.prod}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Set JWT_ISSUER_URI in deployment/.env.prod}
      KEYCLOAK_AUTH_URI: ${KEYCLOAK_AUTH_URI:?Set KEYCLOAK_AUTH_URI in deployment/.env.prod}
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI:?Set KEYCLOAK_TOKEN_URI in deployment/.env.prod}
      KEYCLOAK_USERINFO_URI: ${KEYCLOAK_USERINFO_URI:?Set KEYCLOAK_USERINFO_URI in deployment/.env.prod}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:?Set SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI in deployment/.env.prod}
      KEYCLOAK_ADMIN_SERVER_URL: ${KEYCLOAK_ADMIN_SERVER_URL:?Set KEYCLOAK_ADMIN_SERVER_URL in deployment/.env.prod}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in deployment/.env.prod}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in deployment/.env.prod}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-apu-asc}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?Set SPRING_MAIL_HOST in deployment/.env.prod}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:?Set SPRING_MAIL_PORT in deployment/.env.prod}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in deployment/.env.prod}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD in deployment/.env.prod}
      S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in deployment/.env.prod}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in deployment/.env.prod}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in deployment/.env.prod}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in deployment/.env.prod}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-myr}
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-production}
      OBSERVABILITY_RELEASE: ${OBSERVABILITY_RELEASE:-manual}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-apu-asc-backend}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_TRACING_SAMPLING_PROBABILITY: ${OTEL_TRACING_SAMPLING_PROBABILITY:-0.25}
      OBSERVABILITY_PROMETHEUS_ALLOWED_CIDR: ${OBSERVABILITY_PROMETHEUS_ALLOWED_CIDR:?Set OBSERVABILITY_PROMETHEUS_ALLOWED_CIDR in deployment/.env.prod}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [app]

  web:
    image: ${IMAGE_REGISTRY:?Set IMAGE_REGISTRY in deployment/.env.prod}/apu-asc-web:${IMAGE_TAG:?Set IMAGE_TAG in deployment/.env.prod}
    restart: unless-stopped
    environment:
      PORT: 3000
      INTERNAL_BACKEND_URL: http://backend:8081
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      web:
        condition: service_started
    networks: [app, npm]

  grafana:
    image: grafana/grafana:11.5.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in deployment/.env.prod}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks: [app]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
    networks: [app]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    entrypoint: [/bin/sh, /etc/alertmanager/entrypoint.sh]
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?Set ALERT_EMAIL_TO in deployment/.env.prod}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?Set SPRING_MAIL_HOST in deployment/.env.prod}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:?Set SPRING_MAIL_PORT in deployment/.env.prod}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in deployment/.env.prod}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD in deployment/.env.prod}
    volumes:
      - ../infra/observability/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ../infra/observability/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
    networks: [app]

  alloy:
    image: grafana/alloy:v1.4.0
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    environment:
      OBSERVABILITY_S3_ENDPOINT: ${OBSERVABILITY_S3_ENDPOINT:?Set OBSERVABILITY_S3_ENDPOINT in deployment/.env.prod}
      OBSERVABILITY_S3_REGION: ${OBSERVABILITY_S3_REGION:-auto}
      OBSERVABILITY_S3_ACCESS_KEY: ${OBSERVABILITY_S3_ACCESS_KEY:?Set OBSERVABILITY_S3_ACCESS_KEY in deployment/.env.prod}
      OBSERVABILITY_S3_SECRET_KEY: ${OBSERVABILITY_S3_SECRET_KEY:?Set OBSERVABILITY_S3_SECRET_KEY in deployment/.env.prod}
    volumes:
      - ../infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - tempo
    networks: [app]

  loki:
    image: grafana/loki:3.6.8
    restart: unless-stopped
    command: [-config.file=/etc/loki/config.yml, -config.expand-env=true]
    environment:
      OBSERVABILITY_S3_ENDPOINT: ${OBSERVABILITY_S3_ENDPOINT:?Set OBSERVABILITY_S3_ENDPOINT in deployment/.env.prod}
      OBSERVABILITY_S3_REGION: ${OBSERVABILITY_S3_REGION:-auto}
      OBSERVABILITY_S3_ACCESS_KEY: ${OBSERVABILITY_S3_ACCESS_KEY:?Set OBSERVABILITY_S3_ACCESS_KEY in deployment/.env.prod}
      OBSERVABILITY_S3_SECRET_KEY: ${OBSERVABILITY_S3_SECRET_KEY:?Set OBSERVABILITY_S3_SECRET_KEY in deployment/.env.prod}
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:?Set LOKI_S3_BUCKET in deployment/.env.prod}
    volumes:
      - ../infra/observability/loki/loki.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [app]

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export OBSERVABILITY_S3_ENDPOINT="$${OBSERVABILITY_S3_ENDPOINT#https://}"
        exec /tempo -config.file=/etc/tempo/config.yml -config.expand-env=true
    environment:
      OBSERVABILITY_S3_ENDPOINT: ${OBSERVABILITY_S3_ENDPOINT:?Set OBSERVABILITY_S3_ENDPOINT in deployment/.env.prod}
      OBSERVABILITY_S3_ACCESS_KEY: ${OBSERVABILITY_S3_ACCESS_KEY:?Set OBSERVABILITY_S3_ACCESS_KEY in deployment/.env.prod}
      OBSERVABILITY_S3_SECRET_KEY: ${OBSERVABILITY_S3_SECRET_KEY:?Set OBSERVABILITY_S3_SECRET_KEY in deployment/.env.prod}
      TEMPO_S3_BUCKET: ${TEMPO_S3_BUCKET:?Set TEMPO_S3_BUCKET in deployment/.env.prod}
    volumes:
      - ../infra/observability/tempo/tempo.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
    networks: [app]

networks:
  app:
    name: apu-asc-prod-app
    ipam:
      config:
        - subnet: ${APU_ASC_NETWORK_SUBNET:-172.30.0.0/16}
  npm:
    external: true
    name: ${NPM_NETWORK_NAME:?Set NPM_NETWORK_NAME in deployment/.env.prod}

volumes:
  postgres_data:
  valkey_data:
  grafana_data:
  prometheus_data:
  loki_data:
  tempo_data:
