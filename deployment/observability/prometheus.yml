global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: apu-asc-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:8081]

  - job_name: observability-stack
    static_configs:
      - targets: [loki:3100, tempo:3200, alloy:12345]
