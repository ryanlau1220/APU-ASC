version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    container_name: apu-asc-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - apu-asc-net

  postgres:
    image: postgres:16-alpine
    container_name: apu-asc-postgres
    environment:
      POSTGRES_DB: apu_asc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apu-asc-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: apu-asc-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/apu_asc
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres_password
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m"
    volumes:
      - ./docker/keycloak/apu-asc-realm.json:/opt/keycloak/data/import/apu-asc-realm.json:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    depends_on:
      - postgres
    networks:
      - apu-asc-net

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: apu-asc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio_data:/data
    networks:
      - apu-asc-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: apu-asc-mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    networks:
      - apu-asc-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apu-asc-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/apu_asc
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres_password
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/apu-asc
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/v3/api-docs`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
    depends_on:
      - postgres
      - keycloak
    networks:
      - apu-asc-net

networks:
  apu-asc-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
