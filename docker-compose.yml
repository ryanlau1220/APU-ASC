services:
  traefik:
    image: traefik:v3.0
    container_name: apu-asc-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.network=apu-asc-net"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8088:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - apu-asc-net

  postgres:
    image: postgres:16-alpine
    container_name: apu-asc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apu_asc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      # Host port 5433 mapped for direct local Spring Boot development outside Docker
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apu-asc-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: apu-asc-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-apu_asc}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m"
      SMTP_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SPRING_MAIL_PORT:-587}
      SMTP_FROM: ${SPRING_MAIL_USERNAME:-liujunhong20@gmail.com}
      SMTP_USERNAME: ${SPRING_MAIL_USERNAME:-liujunhong20@gmail.com}
      SMTP_PASSWORD: ${SPRING_MAIL_PASSWORD}
    volumes:
      # Keycloak realm & theme volumes mounted from host (database state persisted in postgres)
      - ./infra/keycloak/apu-asc-realm.json:/opt/keycloak/data/import/apu-asc-realm.json:ro
      - ./infra/keycloak/themes/apu-asc:/opt/keycloak/themes/apu-asc:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /auth/realms/apu-asc/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -c 20 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak.service=keycloak"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    depends_on:
      - postgres
    networks:
      - apu-asc-net

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: apu-asc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_S3_SECRET_KEY:-minioadminpassword}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console UI
    volumes:
      - minio_data:/data
    networks:
      - apu-asc-net

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: apu-asc-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - apu-asc-net

networks:
  apu-asc-net:
    name: apu-asc-net
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  valkey_data:
