services:
  traefik:
    image: traefik:v3.0
    container_name: apu-asc-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.network=apu-asc-net"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8088:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - apu-asc-net

  postgres:
    image: postgres:16-alpine
    container_name: apu-asc-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apu_asc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      # Host port 5433 mapped for direct local Spring Boot development outside Docker
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apu-asc-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: apu-asc-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-apu_asc}
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m -XX:MaxMetaspaceSize=192m"
      SMTP_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SPRING_MAIL_PORT:-587}
      SMTP_FROM: ${SPRING_MAIL_USERNAME:-liujunhong20@gmail.com}
      SMTP_USERNAME: ${SPRING_MAIL_USERNAME:-liujunhong20@gmail.com}
      SMTP_PASSWORD: ${SPRING_MAIL_PASSWORD}
    volumes:
      # Keycloak realm & theme volumes mounted from host (database state persisted in postgres)
      - ./infra/keycloak/apu-asc-realm.json:/opt/keycloak/data/import/apu-asc-realm.json:ro
      - ./infra/keycloak/themes/apu-asc:/opt/keycloak/themes/apu-asc:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /auth/realms/apu-asc/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -c 20 <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak.service=keycloak"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    depends_on:
      - postgres
    networks:
      - apu-asc-net

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: apu-asc-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_S3_SECRET_KEY:-minioadminpassword}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console UI
    volumes:
      - minio_data:/data
    networks:
      - apu-asc-net

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: apu-asc-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    networks:
      - apu-asc-net

  # Local development only. Stripe CLI forwards sandbox events to the host Spring Boot process.
  # A deployed public endpoint receives webhooks directly from Stripe; do not enable this in prod.
  stripe-cli:
    image: stripe/stripe-cli@sha256:73a0449969bcb4bfa5a53ecb6db82f1ff873189d9e433aff72fa4c8e747acf81
    container_name: apu-asc-stripe-cli
    profiles: [stripe]
    restart: unless-stopped
    command:
      - listen
      - --events=checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.async_payment_failed,checkout.session.expired
      - --forward-to=http://host.docker.internal:8081/api/v1/stripe/webhook
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:?Set STRIPE_SECRET_KEY in .env}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - apu-asc-net

  grafana:
    image: grafana/grafana:11.5.0
    container_name: apu-asc-grafana
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - apu-asc-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: apu-asc-prometheus
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - alertmanager
    networks:
      - apu-asc-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: apu-asc-alertmanager
    profiles: [observability]
    entrypoint: [/bin/sh, /etc/alertmanager/entrypoint.sh]
    environment:
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
    volumes:
      - ./infra/observability/alertmanager/alertmanager.yml.tmpl:/etc/alertmanager/alertmanager.yml.tmpl:ro
      - ./infra/observability/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
    networks:
      - apu-asc-net

  alloy:
    image: grafana/alloy:v1.4.0
    container_name: apu-asc-alloy
    profiles: [observability]
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    environment:
      OBSERVABILITY_S3_ENDPOINT: ${OBSERVABILITY_S3_ENDPOINT:?Set OBSERVABILITY_S3_ENDPOINT in .env}
      OBSERVABILITY_S3_REGION: ${OBSERVABILITY_S3_REGION:-auto}
      OBSERVABILITY_S3_ACCESS_KEY: ${OBSERVABILITY_S3_ACCESS_KEY:?Set OBSERVABILITY_S3_ACCESS_KEY in .env}
      OBSERVABILITY_S3_SECRET_KEY: ${OBSERVABILITY_S3_SECRET_KEY:?Set OBSERVABILITY_S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - tempo
    networks:
      - apu-asc-net

  loki:
    image: grafana/loki:3.6.8
    container_name: apu-asc-loki
    profiles: [observability]
    command:
      - -config.file=/etc/loki/config.yml
      - -config.expand-env=true
    environment:
      OBSERVABILITY_S3_ENDPOINT: ${OBSERVABILITY_S3_ENDPOINT:?Set OBSERVABILITY_S3_ENDPOINT in .env}
      OBSERVABILITY_S3_REGION: ${OBSERVABILITY_S3_REGION:-auto}
      OBSERVABILITY_S3_ACCESS_KEY: ${OBSERVABILITY_S3_ACCESS_KEY:?Set OBSERVABILITY_S3_ACCESS_KEY in .env}
      OBSERVABILITY_S3_SECRET_KEY: ${OBSERVABILITY_S3_SECRET_KEY:?Set OBSERVABILITY_S3_SECRET_KEY in .env}
      LOKI_S3_BUCKET: ${LOKI_S3_BUCKET:?Set LOKI_S3_BUCKET in .env}
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/config.yml:ro
    networks:
      - apu-asc-net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: apu-asc-tempo
    profiles: [observability]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export OBSERVABILITY_S3_ENDPOINT="$${OBSERVABILITY_S3_ENDPOINT#https://}"
        exec /tempo -config.file=/etc/tempo/config.yml -config.expand-env=true
    environment:
      OBSERVABILITY_S3_ENDPOINT: ${OBSERVABILITY_S3_ENDPOINT:?Set OBSERVABILITY_S3_ENDPOINT in .env}
      OBSERVABILITY_S3_ACCESS_KEY: ${OBSERVABILITY_S3_ACCESS_KEY:?Set OBSERVABILITY_S3_ACCESS_KEY in .env}
      OBSERVABILITY_S3_SECRET_KEY: ${OBSERVABILITY_S3_SECRET_KEY:?Set OBSERVABILITY_S3_SECRET_KEY in .env}
      TEMPO_S3_BUCKET: ${TEMPO_S3_BUCKET:?Set TEMPO_S3_BUCKET in .env}
    volumes:
      - ./infra/observability/tempo/tempo.yml:/etc/tempo/config.yml:ro
    networks:
      - apu-asc-net

networks:
  apu-asc-net:
    name: apu-asc-net
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  valkey_data:
  grafana_data:
  prometheus_data:
