server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: s3
    s3:
      bucket: ${TEMPO_S3_BUCKET}
      endpoint: ${OBSERVABILITY_S3_ENDPOINT}
      access_key: ${OBSERVABILITY_S3_ACCESS_KEY}
      secret_key: ${OBSERVABILITY_S3_SECRET_KEY}
      insecure: false
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 168h
